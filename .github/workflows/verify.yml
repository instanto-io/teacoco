name: Verify and publish TeaCoCo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: teacoco-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify Maven artifacts and independent consumers against upstream TeaVM and real Chrome
        run: mvn -B -ntp -s central-settings.xml clean install
      - name: Verify Gradle plugin and consumer integrations
        run: ./gradlew --no-daemon check publishToMavenLocal
      - name: Publish quality summary
        if: always()
        continue-on-error: true
        uses: instanto-io/instanto-poms/.github/actions/quality-summary@main
        with:
          sonar-project-key: teacoco
          sonar-token: ${{ secrets.SONAR_READ_TOKEN || secrets.SONAR_TOKEN }}
      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: '**/target/spotbugs/'
          if-no-files-found: ignore
          retention-days: 7

  publish-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # packages.instanto.io is private-network infrastructure, reachable by this pool.
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 45
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
      MAVEN_CENTRAL_MIRROR_URL: ${{ vars.MAVEN_CENTRAL_MIRROR_URL }}
    steps:
      - name: Allocate job-local Gradle cache
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/teacoco-gradle-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Restore runner-local Maven downloads
        uses: instanto-io/instanto-poms/.github/actions/maven-cache@main
        with:
          mode: prepare
          maven-args: -Dmaven.repo.local=${{ runner.temp }}/teacoco-deploy-m2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish snapshots to Instanto
        run: |
          set -euo pipefail
          if [ -z "$FORGEJO_PACKAGE_USER" ] || [ -z "$FORGEJO_PACKAGE_TOKEN" ]; then
            echo '::error::Grant instanto-io/tea-coco access to the organisation Forgejo package user and write-token secrets.'
            exit 1
          fi
          settings="$RUNNER_TEMP/teacoco-maven-settings.xml"
          cp .github/maven-settings.xml "$settings"
          if [ -n "${MAVEN_CENTRAL_MIRROR_URL:-}" ]; then
            python3 - "$settings" <<'PYSET'
          import pathlib, sys, xml.etree.ElementTree as ET
          p = pathlib.Path(sys.argv[1])
          tree = ET.parse(p)
          root = tree.getroot()
          ns = "http://maven.apache.org/SETTINGS/1.2.0"
          ET.register_namespace("", ns)
          mirrors = ET.SubElement(root, f"{{{ns}}}mirrors")
          mirror = ET.SubElement(mirrors, f"{{{ns}}}mirror")
          ET.SubElement(mirror, f"{{{ns}}}id").text = "central"
          ET.SubElement(mirror, f"{{{ns}}}mirrorOf").text = "central"
          ET.SubElement(mirror, f"{{{ns}}}url").text = "${env.MAVEN_CENTRAL_MIRROR_URL}"
          tree.write(p, encoding="unicode", xml_declaration=True)
          PYSET
          fi
          mvn -B -ntp -s "$settings" \
            -Daether.transport.http.connectTimeout=30000 \
            -Daether.transport.http.requestTimeout=120000 \
            -Daether.transport.http.retryHandler.count=8 \
            -Daether.transport.http.retryHandler.interval=10000 \
            -Daether.transport.http.retryHandler.serviceUnavailable=429,502,503,504 \
            -Dmaven.artifact.threads=2 \
            -Dmaven.repo.local="$RUNNER_TEMP/teacoco-deploy-m2-${{ github.run_id }}-${{ github.run_attempt }}" \
            -pl coverage,maven-plugin -am clean deploy \
            -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Dspotless.skip=true
          if [ -n "${MAVEN_CENTRAL_MIRROR_URL:-}" ]; then
            mkdir -p "$GRADLE_USER_HOME/init.d"
            cat > "$GRADLE_USER_HOME/init.d/central-mirror.gradle" <<'GRADLE'
          String mirror = System.getenv("MAVEN_CENTRAL_MIRROR_URL")
          if (mirror != null && !mirror.isEmpty()) {
              beforeSettings { settings ->
                  settings.pluginManagement.repositories.configureEach { repo ->
                      if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                          String url = repo.url.toString()
                          if (url.startsWith("https://repo.maven.apache.org/maven2") || url.startsWith("https://repo1.maven.org/maven2")) {
                              repo.setUrl(java.net.URI.create(mirror))
                          }
                      }
                  }
              }
              allprojects { project ->
                  project.repositories.configureEach { repo ->
                      if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                          String url = repo.url.toString()
                          if (url.startsWith("https://repo.maven.apache.org/maven2") || url.startsWith("https://repo1.maven.org/maven2")) {
                              repo.setUrl(java.net.URI.create(mirror))
                          }
                      }
                  }
              }
          }
          GRADLE
          fi
          for attempt in 1 2 3 4 5; do
            if ./gradlew --no-daemon --version; then break; fi
            [ "$attempt" -lt 5 ] || exit 1
            rm -rf "$GRADLE_USER_HOME/wrapper/dists"
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Djava.net.preferIPv4Stack=true"
            sleep 5
          done
          ./gradlew --no-daemon publish
      - name: Save runner-local Maven downloads
        if: always()
        uses: instanto-io/instanto-poms/.github/actions/maven-cache@main
        with:
          mode: save
          maven-args: -Dmaven.repo.local=${{ runner.temp }}/teacoco-deploy-m2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Clean job-local package caches
        if: always()
        run: |
          rm -rf -- "$GRADLE_USER_HOME" \
            "$RUNNER_TEMP/teacoco-deploy-m2-${{ github.run_id }}-${{ github.run_attempt }}"

  mockatcha-example:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, instanto-container]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mockatcha-example
    env:
      FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
      FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN || secrets.FORGEJO_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Allocate isolated Maven cache
        run: echo "DEMO_MAVEN_CACHE=$RUNNER_TEMP/mockatcha-demo-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - name: Verify local TeaCoCo snapshots with JVM and browser tests
        run: |
          mvn -B -ntp -f ../pom.xml -s settings.xml -Dmaven.repo.local="$DEMO_MAVEN_CACHE" \
            -pl coverage,maven-plugin -am -DskipTests -Dspotbugs.skip=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Dspotless.skip=true clean install
          mvn -B -ntp -U -s settings.xml -Dmaven.repo.local="$DEMO_MAVEN_CACHE" clean verify
          cat target/coverage-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish coverage diagnostics
        if: always()
        run: |
          python3 .github/scripts/publish_report.py --name timesheet-coverage \
            --path target/site --path target/surefire-reports --path target/failsafe-reports \
            --path target/teavm-coverage.xml --path target/teavm-coverage.xml.exec \
            --path target/browser-coverage.xml --path target/compiler-evidence.json \
            --path target/coverage-comparison.md
      - name: Clean isolated Maven cache
        if: always()
        run: rm -rf -- "$DEMO_MAVEN_CACHE"
